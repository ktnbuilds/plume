spring:
  application:
    name: rider-service
  datasource:
    url: "${DB_URL}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        max-page-size: 50
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: 8081
  servlet:
    # TODO: /api is a placeholder. Once the API Gateway exists, decide routing there (e.g. gateway receives /riders/** and forwards to this service) — don't bake a /riders prefix in here preemptively.
    context-path: /api